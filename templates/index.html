<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment Agent — 生态环境 Agent</title>
<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/v3.css?v=27">
<link rel="stylesheet" href="/static/v3_extra.css?v=8">
</head>
<body>
<div id="app" class="shell">

  <!-- 桌面标题栏（pywebview 壳，全宽置顶） -->
  <div class="titlebar">
    <div class="tb-logo">Environment Agent</div>
    <div class="tb-drag"></div>
    <div class="tb-btns">
      <span class="tb-btn" id="btn-win-min" title="最小化"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></span>
      <span class="tb-btn" id="btn-win-max" title="最大化 / 复原"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></span>
      <span class="tb-btn close" id="btn-win-close" title="关闭"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
    </div>
  </div>

  <div class="app-body">

  <!-- 左侧图标导航 -->
  <div class="rail">
    <nav id="rail-nav">
      <a class="active" data-view="chat" title="对话工作台"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="tip">对话工作台</span></a>
      <a data-view="kb" title="知识库"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="tip">知识库</span></a>
      <a data-view="reports" title="报告中心"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span class="tip">报告中心</span></a>
      <a data-view="planner" title="计划调度"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="tip">计划调度</span></a>
      <a data-view="review" title="审核中心"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg><span class="dot" id="rail-review-dot" style="display:none">0</span><span class="tip">审核中心</span></a>
      <a data-view="memory" title="记忆中心"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg><span class="dot" id="rail-mem-dot" style="display:none">0</span><span class="tip">记忆中心</span></a>
      <a data-view="skills" title="技能市场"><svg viewBox="0 0 24 24"><path d="M12 2l3 6 7 .5-5.5 4.5L18.5 21 12 16.5 5.5 21l2-8L2 8.5 9 8z"/></svg><span class="dot" id="rail-skill-dot" style="display:none"></span><span class="tip">技能市场</span></a>
      <a data-view="obs" title="观测追踪"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/></svg><span class="tip">观测追踪</span></a>
      <a data-view="settings" title="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="tip">设置</span></a>
    </nav>
  </div>

  <!-- 视图容器（内容由 v3.js 注入） -->
  <div class="main">
    <section id="v-chat" class="view active"></section>
    <section id="v-kb" class="view"></section>
    <section id="v-reports" class="view"></section>
    <section id="v-rep-editor" class="view"></section>
    <section id="v-roles" class="view"></section>
    <section id="v-workflow" class="view"></section>
    <section id="v-planner" class="view"></section>
    <section id="v-review" class="view"></section>
    <section id="v-memory" class="view"></section>
    <section id="v-skills" class="view"></section>
    <section id="v-obs" class="view"></section>
    <section id="v-settings" class="view"></section>
  </div>

  </div><!-- /app-body -->
</div><!-- /shell -->
<div id="toast"></div>
<script src="/static/v3.js?v=8"></script>
<script src="/static/v3_chat.js?v=16"></script>
<script src="/static/v3_kb.js?v=18"></script>
<script src="/static/v3_reports.js?v=6"></script>
<script src="/static/v3_roles_wf.js?v=6"></script>
<script src="/static/v3_mem_skill_plan.js?v=9"></script>
<script src="/static/v3_review_obs_settings.js?v=11"></script>
</body>
</html>
